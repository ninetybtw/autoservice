<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Онлайн-запись в автостудию" />
    <title>Запись в автостудию</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <script>
      // Свой манифест и иконка для каждой студии: /<slug> → /api/manifest?slug=<slug>
      (function () {
        var slug = location.pathname.split('/')[1] || '';
        var ok = /^[a-z0-9-]{2,40}$/.test(slug);
        var m = document.createElement('link');
        m.rel = 'manifest';
        m.href = ok ? '/api/manifest?slug=' + slug : '/api/manifest';
        document.head.appendChild(m);
        var a = document.createElement('link');
        a.rel = 'apple-touch-icon';
        a.href = ok ? '/api/manifest?icon=1&slug=' + slug : '/icons/icon-192.png';
        document.head.appendChild(a);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
